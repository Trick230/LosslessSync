[package]
name = "lls-dsp"
version = "0.1.0"
edition = "2021"
description = "Native DSP kernels for LosslessSync (WSOLA and Signalsmith time stretch)"
publish = false

[dependencies]
realfft = "3"
signalsmith-stretch = { version = "0.1.3", optional = true }

[features]
# the "stretch" subcommand (Signalsmith Stretch, C++: needs a C++ compiler and libclang)
signalsmith = ["dep:signalsmith-stretch"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# quick rebuilds while iterating: cargo build --profile dev-fast
[profile.dev-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
