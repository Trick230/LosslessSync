name: ci
on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# a newer push replaces a run still in progress (a cancelled one is redone by the next run:
# the cache and the Drive upload are keyed by the dsp/ hash)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ruff + mypy (versions pinned in tools/lls.py, settings in pyproject.toml)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./lls lint

  # lls-dsp for each platform, kept in the actions cache under dsp-<hash of dsp/> (a platform
  # already there is not rebuilt) and put on the project's Drive, where `lls setup` gets it
  dsp:
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, lls: ./lls}
          - {os: ubuntu-24.04-arm, lls: ./lls}
          - {os: windows-latest, lls: ./lls.cmd}
          - {os: windows-11-arm, lls: ./lls.cmd}
    runs-on: ${{ matrix.os }}
    outputs:
      tag: ${{ steps.id.outputs.tag }}
      hash: ${{ steps.id.outputs.hash }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - id: id
        run: |
          $tag = "dsp-$(${{ matrix.lls }} dsp-hash)"
          $asset = "$(${{ matrix.lls }} dsp-asset)"
          if ($tag -notmatch '^dsp-[0-9a-f]{12}$' -or -not $asset) { throw "lls dsp-hash failed" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "hash=$($tag.Substring(4))" >> $env:GITHUB_OUTPUT
          "asset=$asset" >> $env:GITHUB_OUTPUT
      - id: cache
        uses: actions/cache@v4
        with:
          path: dist/
          key: ${{ steps.id.outputs.tag }}-${{ matrix.os }}
      - name: libclang (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo apt-get install -y -q libclang-dev
      - name: toolchain (Windows ARM)
        if: steps.cache.outputs.cache-hit != 'true' && matrix.os == 'windows-11-arm'
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -OutFile rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --profile minimal
            "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH
          }
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
      - name: build
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: dsp
        run: |
          if ($IsWindows) {   # static CRT: no Visual C++ redistributable needed
            $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
            $env:RUSTFLAGS = "-C target-feature=+crt-static"
          }
          cargo build -q --release --features signalsmith
          if ($LASTEXITCODE) { exit 1 }
          $exe = if ($IsWindows) { "lls-dsp.exe" } else { "lls-dsp" }
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Copy-Item "target/release/$exe" "../dist/${{ steps.id.outputs.asset }}"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.id.outputs.asset }}
          path: dist/

  # the builds to the project's Drive (dsp/<hash>/), through devcloud (secrets: not on pull
  # requests); rclone skips files already there
  drive:
    needs: dsp
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/dc.yml
    with:
      id: ci
      artifacts_in: dist
      commands: '["./.devcloud/dc drive put dist dsp/${{ needs.dsp.outputs.hash }}"]'
    secrets: {DC_ENV: "${{ secrets.DC_ENV }}"}

  # lls-dsp from the cache the dsp job filled, so setup neither fetches nor builds it
  test:
    needs: dsp
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, lls: ./lls, all: true}
          - {os: ubuntu-24.04-arm, lls: ./lls}
          - {os: windows-latest, lls: ./lls.cmd}
          - {os: windows-11-arm, lls: ./lls.cmd}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: dist/
          key: ${{ needs.dsp.outputs.tag }}-${{ matrix.os }}
          fail-on-cache-miss: true
      - name: lls-dsp from the cache
        run: |
          $asset = "$(${{ matrix.lls }} dsp-asset)"
          $plat = $asset -replace '^lls-dsp-', '' -replace '\.exe$', ''
          $exe = if ($IsWindows) { "lls-dsp.exe" } else { "lls-dsp" }
          New-Item -ItemType Directory -Force ".lls/$plat/bin" | Out-Null
          Copy-Item "dist/$asset" ".lls/$plat/bin/$exe"
          if (-not $IsWindows) { chmod +x ".lls/$plat/bin/$exe" }
          Set-Content -Path ".lls/$plat/bin/lls-dsp.hash" -Value "$(${{ matrix.lls }} dsp-hash)" -NoNewline
      - name: setup
        run: ${{ matrix.lls }} setup
      - name: lls-dsp present
        run: |
          $out = ${{ matrix.lls }} check
          $out
          if (-not ($out | Select-String "lls-dsp\s+: .*lls-dsp")) { throw "no lls-dsp" }
      - name: quick cases
        run: ${{ matrix.lls }} test
      - name: all cases
        if: matrix.all
        run: ${{ matrix.lls }} test all
      - name: reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports-${{ matrix.os }}
          path: |
            test_out/**/*.json
            test_out/**/*.html
            test_out/**/*.log
            test_out/**/*.txt
          if-no-files-found: ignore

  # a real episode synced and compared with tools/regress.json; the episode comes from the
  # project's Drive through devcloud (secrets: not on pull requests) and never leaves the job
  regress:
    needs: drive
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/dc.yml
    with: {id: ci, commands: '["./lls setup && ./lls py tools/regress.py"]'}
    secrets: {DC_ENV: "${{ secrets.DC_ENV }}"}
