# devcloud (https://github.com/Trick230/devcloud): `dc run` dispatches this; pinned to one
# devcloud commit (`dc init` again moves the pin to the current one)
name: dc
run-name: dc ${{ inputs.id }} ${{ inputs.commands }}
on:
  workflow_dispatch:
    inputs:
      id: {default: ""}
      commands: {required: true}
      os: {default: ubuntu-latest}
      drive_in: {default: ""}
      drive_out: {default: ""}
      artifacts: {default: ""}
jobs:
  run:
    uses: Trick230/devcloud/.github/workflows/run.yml@8e655bc247e448c733fe9c0d02f0a4b18a52d31f
    with: {commands: "${{ inputs.commands }}", os: "${{ inputs.os }}", drive_in: "${{ inputs.drive_in }}", drive_out: "${{ inputs.drive_out }}", artifacts: "${{ inputs.artifacts }}", ref: 8e655bc247e448c733fe9c0d02f0a4b18a52d31f}
    secrets: {DC_ENV: "${{ secrets.DC_ENV }}"}
