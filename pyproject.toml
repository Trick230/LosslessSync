[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "losslesssync"
version = "0.1.0"
description = "Sync a dubbed audio track (e.g. a TV recording) to a reference release using the shared music & effects"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.scripts]
losslesssync = "losslesssync.app.cli:main"

[project.gui-scripts]
losslesssync-gui = "losslesssync.app.gui:main"

[tool.setuptools]
packages = ["losslesssync", "losslesssync.app", "losslesssync.sync", "losslesssync.audio", "losslesssync.stretch"]
